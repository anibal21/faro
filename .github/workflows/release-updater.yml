# Multi-platform Faro release packages + updater feed
#
# Secrets required:
#   TAURI_SIGNING_PRIVATE_KEY — contents of the private signing key (never commit)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — optional if the key has no password
#   GITHUB_TOKEN — provided by Actions (contents:write) for uploading release assets
#
# Mandatory assets (strict gate): Windows NSIS(+sig), macOS DMG + updater tar(+sig),
# Linux AppImage(+sig), Linux .deb, and latest.json.
# No Apple notarization in this workflow (internal team / Gatekeeper bypass documented).

name: Release multi-platform packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Windows NSIS + updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis

      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" dist-release/
          Copy-Item "src-tauri/target/release/bundle/nsis/*-setup.exe.sig" dist-release/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist-release/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build macOS DMG + updater artifacts (no notarization)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles dmg

      - name: Stage macOS artifacts
        run: |
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/dmg/*.dmg dist-release/
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz dist-release/
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig dist-release/
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist-release/*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Linux AppImage + deb + updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles appimage,deb

      - name: Stage Linux artifacts
        run: |
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-release/
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig dist-release/
          cp src-tauri/target/release/bundle/deb/*.deb dist-release/
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist-release/*
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts for verification
        run: |
          mkdir -p release-flat
          find release-artifacts -type f -exec cp -n {} release-flat/ \;
          ls -la release-flat

      - name: Verify mandatory assets (strict gate)
        run: |
          chmod +x scripts/ci/verify-release-assets.sh
          scripts/ci/verify-release-assets.sh release-flat

      - name: Build multiplatform latest.json
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            TAG_NAME="v${VERSION}"
          fi
          case "$TAG_NAME" in
            v*) ;;
            *) TAG_NAME="v${TAG_NAME}" ;;
          esac
          BASE="https://github.com/anibal21/faro/releases/download/${TAG_NAME}"

          WIN_EXE=$(basename "$(ls release-flat/*-setup.exe | head -n1)")
          WIN_SIG_PATH=$(ls release-flat/*-setup.exe.sig | head -n1)
          MAC_TAR=$(basename "$(ls release-flat/*.app.tar.gz | head -n1)")
          MAC_SIG_PATH=$(ls release-flat/*.app.tar.gz.sig | head -n1)
          LIN_APP=$(basename "$(ls release-flat/*.AppImage | head -n1)")
          LIN_SIG_PATH=$(ls release-flat/*.AppImage.sig | head -n1)

          export VERSION BASE WIN_EXE WIN_SIG_PATH MAC_TAR MAC_SIG_PATH LIN_APP LIN_SIG_PATH
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const base = process.env.BASE;
            const json = {
              version,
              notes: `Faro ${version}`,
              platforms: {
                "windows-x86_64": {
                  url: `${base}/${process.env.WIN_EXE}`,
                  signature: fs.readFileSync(process.env.WIN_SIG_PATH, "utf8").trim(),
                },
                "darwin-x86_64": {
                  url: `${base}/${process.env.MAC_TAR}`,
                  signature: fs.readFileSync(process.env.MAC_SIG_PATH, "utf8").trim(),
                },
                "linux-x86_64": {
                  url: `${base}/${process.env.LIN_APP}`,
                  signature: fs.readFileSync(process.env.LIN_SIG_PATH, "utf8").trim(),
                },
              },
            };
            fs.writeFileSync("latest.json", JSON.stringify(json, null, 2) + "\n");
            console.log(JSON.stringify(json, null, 2));
          '
          cp latest.json release-flat/

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" release-flat/* --clobber

# Publish Faro updater artifacts to GitHub Releases
#
# Secrets required:
#   TAURI_SIGNING_PRIVATE_KEY — contents of the private key (never commit)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — optional if the key has no password
#   GITHUB_TOKEN — provided by Actions for uploading release assets
#
# Produces: NSIS setup.exe, setup.exe.sig, and latest.json for tauri-plugin-updater.

name: Release updater feed

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Windows NSIS + updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis

      - name: Build latest.json
        shell: pwsh
        run: |
          $nsisDir = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $nsisDir) { throw "NSIS setup.exe not found" }
          $exe = $nsisDir.FullName
          $sigPath = "$exe.sig"
          if (-not (Test-Path $sigPath)) { throw "Missing signature $sigPath" }
          $sig = Get-Content -Raw $sigPath
          $version = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v$version" }
          $url = "https://github.com/anibal21/faro/releases/download/$tag/$($nsisDir.Name)"
          $json = @{
            version = $version
            notes = "Faro $version"
            platforms = @{
              "windows-x86_64" = @{
                url = $url
                signature = $sig.Trim()
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "latest.json" -Value $json -Encoding utf8
          Write-Host "Wrote latest.json for $url"

      - name: Upload release assets
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          gh release upload $tag $exe.FullName "$($exe.FullName).sig" latest.json --clobber

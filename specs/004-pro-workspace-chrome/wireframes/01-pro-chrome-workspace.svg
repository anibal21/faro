    <text x="249" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-004</text>
    <rect x="286" y="58" width="62" height="22" rx="4" fill="#ea580c"/>
    <text x="317" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">SC-001</text>

    <text x="520" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">2) US2 - Env tree label + edit</text>
    <text x="520" y="50" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Click en label; menu: Desconectar + Editar configuracion; dots de estado.</text>
    <rect x="520" y="58" width="56" height="22" rx="4" fill="#0891b2"/>
    <text x="548" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">US2</text>
    <rect x="582" y="58" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="613" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-005</text>
    <rect x="650" y="58" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="681" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-006</text>
    <rect x="718" y="58" width="62" height="22" rx="4" fill="#ea580c"/>
    <text x="749" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">SC-003</text>

    <text x="1020" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">3) US3 - Full-width logs + drawer</text>
    <text x="1020" y="50" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Logs ancho completo; analisis en drawer inferior plegable/redimensionable.</text>
    <rect x="1020" y="58" width="56" height="22" rx="4" fill="#0891b2"/>
    <text x="1048" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">US3</text>
    <rect x="1082" y="58" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="1113" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-009</text>
    <rect x="1150" y="58" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="1181" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-010</text>
    <rect x="1218" y="58" width="62" height="22" rx="4" fill="#ea580c"/>
    <text x="1249" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">SC-004</text>

    <text x="20" y="120" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Notas</text>
    <text x="20" y="142" font-family="system-ui, sans-serif" font-size="14" fill="#374151">shadcn + densidad. Temas reemplaza Ver. Sin selector derecho. Drawer cerrado en wireframe 02.</text>
    <rect x="20" y="150" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="51" y="166" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-003</text>
    <rect x="88" y="150" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="119" y="166" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-012</text>
    <rect x="156" y="150" width="62" height="22" rx="4" fill="#ea580c"/>
    <text x="187" y="166" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">SC-005</text>
  </g>

  <text x="40" y="1060" fill="#374151" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">
    004:01 | Pro Workspace Chrome | SpecKit
  </text>

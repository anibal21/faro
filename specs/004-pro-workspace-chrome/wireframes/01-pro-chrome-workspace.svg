    <text x="24" y="256" font-family="ui-monospace, monospace" font-size="14" fill="#1f2937">aaa INFO...</text>
    <g class="callout" transform="translate(320, 300)">
      <circle r="14" fill="#dc2626"/>
      <text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">3</text>
    </g>

    <rect x="12" y="496" width="336" height="140" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="24" y="524" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Drawer analisis</text>
    <text x="24" y="552" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">Hallazgo CRITICAL...</text>

    <rect x="0" y="664" width="360" height="56" rx="24" fill="#dcc8a8"/>
  </g>


<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg004a" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7ddf5"/>
      <stop offset="100%" stop-color="#b8d4f0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg004a)"/>

  <text x="960" y="28" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="18" font-weight="700" fill="#4b5563" letter-spacing="1">
    FARO - PROFESSIONAL WORKSPACE CHROME
  </text>
  <text x="40" y="52" fill="#8b5cf6" font-family="system-ui, sans-serif"
        font-size="18" font-weight="bold">DESKTOP (16:9)</text>
  <text x="1500" y="52" fill="#d946ef" font-family="system-ui, sans-serif"
        font-size="15" font-weight="bold">MOBILE</text>

  <g id="desktop" transform="translate(40, 60)">
    <rect width="1280" height="720" rx="8" fill="#e8d4b8" stroke="#b8a080"/>

    <!-- Menubar only - no bulky header -->
    <rect x="0" y="0" width="1280" height="28" fill="#dcc8a8"/>
    <text x="12" y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Ambientes</text>
    <text x="100" y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Temas</text>
    <g class="callout" transform="translate(160, 14)">
      <circle r="14" fill="#dc2626"/>
      <text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    </g>
    <text x="1268" y="20" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">(sin header ancho)</text>

    <!-- Fixed left tree -->
    <rect x="0" y="28" width="240" height="632" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="8" y="48" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#4b5563">TREE</text>

    <text x="8" y="72" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">v Prod-East  eks-prod</text>
    <circle cx="220" cy="66" r="6" fill="#16a34a"/>
    <g class="callout" transform="translate(200, 66)">
      <circle r="14" fill="#dc2626"/>
      <text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    </g>
    <text x="20" y="96" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">v Pods</text>
    <text x="32" y="118" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">payments-api</text>
    <text x="20" y="140" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">v ConfigMaps</text>
    <text x="8" y="168" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">&gt; Staging  eks-stg</text>
    <circle cx="220" cy="162" r="6" fill="#16a34a"/>
    <text x="8" y="192" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">&gt; Dev  eks-dev</text>
    <circle cx="220" cy="186" r="6" fill="#dc2626"/>

    <!-- Context menu -->
    <rect x="90" y="78" width="150" height="72" rx="4" fill="#e8d4b8" stroke="#1f2937" stroke-width="2"/>
    <text x="100" y="100" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">Desconectar</text>
    <text x="100" y="124" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Editar configuracion</text>
    <g class="callout" transform="translate(230, 118)">
      <circle r="14" fill="#dc2626"/>
      <text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    </g>

    <!-- Main: tabs + full width logs + drawer -->
    <rect x="240" y="28" width="1040" height="632" fill="#e8d4b8"/>
    <rect x="240" y="28" width="1040" height="32" fill="#dcc8a8"/>
    <rect x="248" y="32" width="160" height="24" rx="3" fill="#f5f0e6" stroke="#8b5cf6" stroke-width="2"/>
    <text x="256" y="49" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">Prod: payments-api x</text>

    <rect x="248" y="68" width="80" height="22" rx="3" fill="#8b5cf6"/>
    <text x="288" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">Structured</text>
    <rect x="334" y="68" width="56" height="22" rx="3" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="362" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">Raw</text>

    <!-- Logs full width -->
    <rect x="248" y="98" width="1024" height="360" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="260" y="122" font-family="ui-monospace, monospace" font-size="14" fill="#1f2937">aaa INFO processed id=1</text>
    <text x="260" y="144" font-family="ui-monospace, monospace" font-size="14" fill="#1f2937">bbb INFO processed id=2</text>
    <text x="260" y="166" font-family="ui-monospace, monospace" font-size="14" fill="#b91c1c">aaa ERROR NullPointerException...</text>
    <text x="260" y="198" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">(logs = 100% ancho restante; sin columna derecha)</text>
    <g class="callout" transform="translate(1240, 280)">
      <circle r="14" fill="#dc2626"/>
      <text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">3</text>
    </g>

    <!-- Splitter + drawer open -->
    <rect x="248" y="458" width="1024" height="8" fill="#b8a080"/>
    <text x="760" y="465" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">= splitter =</text>

    <rect x="248" y="466" width="1024" height="180" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="260" y="490" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Analisis / Hallazgos  [cerrar]</text>
    <text x="260" y="516" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">CRITICAL  null-deref  - reiniciar pod afectado</text>
    <text x="260" y="540" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">Panel plegable debajo de logs</text>
    <g class="callout" transform="translate(1240, 520)">

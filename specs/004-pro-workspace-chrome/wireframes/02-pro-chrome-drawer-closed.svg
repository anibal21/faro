    <text x="48" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">US1</text>
    <rect x="82" y="62" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="113" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-001</text>

    <text x="480" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">2) Arbol fijo</text>
    <text x="480" y="54" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Navegacion izquierda estable con drawer cerrado o abierto.</text>
    <rect x="480" y="62" width="56" height="22" rx="4" fill="#0891b2"/>
    <text x="508" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">US2</text>
    <rect x="542" y="62" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="573" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-008</text>

    <text x="980" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">3) Drawer cerrado</text>

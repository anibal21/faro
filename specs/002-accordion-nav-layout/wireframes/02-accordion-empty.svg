    <text x="72" y="30" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">Ambiente</text>
    <text x="160" y="30" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">Ver</text>
    <circle cx="320" cy="24" r="6" fill="#94a3b8"/>
    <text x="334" y="30" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">Desconectado</text>
    <g class="callout" transform="translate(480, 24)">
      <circle r="14" fill="#dc2626"/>
      <text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">1</text>

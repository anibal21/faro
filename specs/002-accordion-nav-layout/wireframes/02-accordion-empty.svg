    <text x="18" y="86" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">&gt; Pods</text>
    <g class="callout" transform="translate(230, 80)">
      <circle r="14" fill="#dc2626"/>
      <text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">2</text>

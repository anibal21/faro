    <text x="18" y="192" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">para ver el catalogo.</text>
    <g class="callout" transform="translate(230, 180)">
      <circle r="14" fill="#dc2626"/>
      <text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">3</text>

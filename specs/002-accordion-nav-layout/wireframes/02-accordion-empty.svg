  <g id="annotations" transform="translate(40, 800)">
    <rect width="1840" height="220" rx="8" fill="#dcc8a8" stroke="#b8a080"/>

    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">1) Estado desconectado</text>
    <text x="20" y="54" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Indicador en chrome; sin inventar catalogo falso.</text>
    <rect x="20" y="62" width="56" height="22" rx="4" fill="#0891b2"/>
    <text x="48" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">US4</text>
    <rect x="82" y="62" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="113" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-011</text>

    <text x="480" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">2) Secciones colapsadas</text>
    <text x="480" y="54" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Pods y ConfigMaps independientes (&gt; / v).</text>
    <rect x="480" y="62" width="56" height="22" rx="4" fill="#0891b2"/>
    <text x="508" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">US4</text>
    <rect x="542" y="62" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="573" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-008</text>
    <rect x="610" y="62" width="62" height="22" rx="4" fill="#ea580c"/>
    <text x="641" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">SC-005</text>

    <text x="980" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">3) Empty hint</text>
    <text x="980" y="54" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Mensaje explicito &quot;conecta primero&quot;, no panel roto.</text>
    <rect x="980" y="62" width="56" height="22" rx="4" fill="#0891b2"/>
    <text x="1008" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">US4</text>
    <rect x="1042" y="62" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="1073" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-011</text>

    <text x="20" y="130" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">4) CTA Conectar</text>
    <text x="20" y="152" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Flujo Ambiente se mantiene; layout solo cambia navegacion post-connect.</text>
    <rect x="20" y="160" width="56" height="22" rx="4" fill="#0891b2"/>
    <text x="48" y="176" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">US1</text>
    <rect x="82" y="160" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="113" y="176" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-009</text>
  </g>

  <text x="40" y="1060" fill="#374151" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">

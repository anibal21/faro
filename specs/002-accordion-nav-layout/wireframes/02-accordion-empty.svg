    <text x="770" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">Ambiente activo</text>
    <text x="770" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">Usa Ambiente - Conectar. Sin pestanas hasta el primer clic.</text>

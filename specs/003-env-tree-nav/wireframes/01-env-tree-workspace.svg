    <text x="520" y="50" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Label=select; icono G/Y/R; click derecho Conectar/Desconectar; multi green; sin selector.</text>
    <rect x="520" y="58" width="56" height="22" rx="4" fill="#0891b2"/>
    <text x="548" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">US2</text>
    <rect x="582" y="58" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="613" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-009</text>

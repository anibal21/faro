    <text x="749" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-013</text>
    <rect x="786" y="58" width="62" height="22" rx="4" fill="#ea580c"/>
    <text x="817" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">SC-009</text>

    <text x="1020" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">3) US3 - Catalog under environment</text>
    <text x="1020" y="50" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Hojas abren pestanas con alcance de ambiente; sin acordeon suelto.</text>
    <rect x="1020" y="58" width="56" height="22" rx="4" fill="#0891b2"/>
    <text x="1048" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">US3</text>
    <rect x="1082" y="58" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="1113" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-010</text>
    <rect x="1150" y="58" width="62" height="22" rx="4" fill="#2563eb"/>

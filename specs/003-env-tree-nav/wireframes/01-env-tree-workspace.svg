    <text x="48" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">US1</text>
    <rect x="82" y="58" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="113" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-001</text>

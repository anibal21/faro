<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg003b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7ddf5"/>
      <stop offset="100%" stop-color="#b8d4f0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg003b)"/>

  <text x="960" y="28" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="18" font-weight="700" fill="#4b5563" letter-spacing="1">
    FARO - ENVIRONMENT TREE EMPTY
  </text>
  <text x="40" y="52" fill="#8b5cf6" font-family="system-ui, sans-serif"
        font-size="18" font-weight="bold">DESKTOP (16:9)</text>
  <text x="1500" y="52" fill="#d946ef" font-family="system-ui, sans-serif"
        font-size="15" font-weight="bold">MOBILE</text>

  <g id="desktop" transform="translate(40, 60)">
    <rect width="1280" height="720" rx="8" fill="#e8d4b8" stroke="#b8a080"/>
    <rect x="0" y="0" width="1280" height="48" fill="#dcc8a8"/>
    <text x="16" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Faro</text>
    <text x="72" y="30" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">Ambiente</text>
    <text x="160" y="30" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">Ver</text>
    <g class="callout" transform="translate(280, 24)">
      <circle r="14" fill="#dc2626"/>
      <text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    </g>

    <rect x="0" y="48" width="300" height="612" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="12" y="72" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#4b5563">AMBIENTES</text>
    <text x="24" y="120" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">No hay ambientes</text>
    <text x="24" y="144" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">guardados aun.</text>
    <text x="24" y="176" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">Configura uno desde</text>
    <text x="24" y="198" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">Ambiente - Nuevo...</text>
    <g class="callout" transform="translate(250, 160)">
      <circle r="14" fill="#dc2626"/>
      <text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    </g>

    <rect x="300" y="48" width="980" height="612" fill="#e8d4b8"/>
    <text x="790" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">Bienvenido a Faro</text>
    <text x="790" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">Sin ambientes en el arbol. Crea uno para empezar.</text>
    <rect x="710" y="360" width="160" height="44" rx="6" fill="#8b5cf6"/>
    <text x="790" y="388" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">Nuevo ambiente</text>
    <g class="callout" transform="translate(890, 382)">
      <circle r="14" fill="#dc2626"/>
      <text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">3</text>

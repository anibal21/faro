    <rect x="0" y="660" width="1280" height="60" fill="#dcc8a8"/>
    <text x="16" y="696" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">Empty state explicito | Sin selector derecho | Sin catalogo inventado</text>
  </g>

  <g id="mobile" transform="translate(1360, 60)">
    <rect width="360" height="720" rx="24" fill="#e8d4b8" stroke="#b8a080"/>
    <rect x="0" y="0" width="360" height="78" rx="24" fill="#dcc8a8"/>
    <rect x="0" y="54" width="360" height="24" fill="#dcc8a8"/>
    <text x="20" y="52" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Faro</text>

    <rect x="12" y="100" width="336" height="140" rx="8" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="24" y="132" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#4b5563">AMBIENTES</text>
    <text x="24" y="164" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">No hay ambientes</text>
    <text x="24" y="188" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">guardados aun.</text>
    <g class="callout" transform="translate(320, 170)">
      <circle r="14" fill="#dc2626"/>
      <text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    </g>

    <rect x="60" y="320" width="240" height="48" rx="8" fill="#8b5cf6"/>
    <text x="180" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">Nuevo ambiente</text>
    <g class="callout" transform="translate(300, 344)">
      <circle r="14" fill="#dc2626"/>
      <text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">3</text>
    </g>

    <rect x="0" y="664" width="360" height="56" rx="24" fill="#dcc8a8"/>
  </g>

  <g id="annotations" transform="translate(40, 800)">
    <rect width="1840" height="220" rx="8" fill="#dcc8a8" stroke="#b8a080"/>

    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">1) Chrome sin selector</text>
    <text x="20" y="54" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Ambiente/Ver permanecen; no hay dropdown de ambiente a la derecha.</text>
    <rect x="20" y="62" width="56" height="22" rx="4" fill="#0891b2"/>
    <text x="48" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">US2</text>
    <rect x="82" y="62" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="113" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-006</text>

    <text x="480" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">2) Empty tree hint</text>
    <text x="480" y="54" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Mensaje explicito; no panel roto ni nodos inventados.</text>
    <rect x="480" y="62" width="56" height="22" rx="4" fill="#0891b2"/>
    <text x="508" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">US1</text>
    <rect x="542" y="62" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="573" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-005</text>
    <rect x="610" y="62" width="62" height="22" rx="4" fill="#ea580c"/>
    <text x="641" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">SC-004</text>

    <text x="980" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">3) CTA Nuevo ambiente</text>
    <text x="980" y="54" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Camino a crear el primer perfil; luego aparece como raiz en el arbol.</text>
    <rect x="980" y="62" width="56" height="22" rx="4" fill="#0891b2"/>
    <text x="1008" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">US1</text>
    <rect x="1042" y="62" width="62" height="22" rx="4" fill="#2563eb"/>
    <text x="1073" y="78" text-anchor="middle" font-size="12" fill="#fff" font-family="system-ui, sans-serif">FR-002</text>
  </g>

  <text x="40" y="1060" fill="#374151" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">

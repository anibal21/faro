<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Faro System Context</title>
  <desc id="desc">Clean columns: User, User machine (Faro + local paths + EKS token), Bastion/EKS/Workloads. Edges do not overlap.</desc>
  <rect width="1200" height="760" fill="#FFFFFF" stroke="#CBD5E1"/>

  <rect x="40" y="24" width="420" height="36" rx="6" fill="#1B2A4A"/>
  <text x="52" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Faro - System Context (v1)</text>
  <rect x="40" y="68" width="900" height="32" rx="4" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="52" y="89" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0F172A">Usuario ? Faro (PEM + IAM file + region/cluster) ? Bastion ? EKS ? Pods. Secretos solo en archivos; Faro guarda rutas.</text>

  <!-- User -->
  <rect x="40" y="200" width="130" height="80" rx="8" fill="#DBEAFE" stroke="#1E3A5F"/>
  <text x="105" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Usuario</text>
  <text x="105" y="256" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0F172A">(ops / dev)</text>

  <!-- Machine boundary -->
  <rect x="220" y="120" width="560" height="520" rx="4" fill="#F8FAFC" stroke="#64748B" stroke-dasharray="8 6"/>
  <text x="234" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Maquina del usuario</text>

  <!-- Faro -->
  <rect x="390" y="160" width="220" height="90" rx="8" fill="#1B2A4A" stroke="#0F172A"/>
  <text x="500" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Faro</text>
  <text x="500" y="214" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF">Tauri 2 + React + SQLite</text>
  <text x="500" y="234" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF">reglas Spring Boot (local)</text>

  <!-- Local row -->
  <rect x="250" y="320" width="150" height="70" rx="6" fill="#FEF3C7" stroke="#92400E"/>
  <text x="325" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#78350F">1. PEM path</text>
  <text x="325" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#78350F">.pem en disco</text>

  <rect x="425" y="320" width="150" height="70" rx="6" fill="#FEF3C7" stroke="#92400E"/>
  <text x="500" y="344" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#78350F">2. IAM credentials</text>
  <text x="500" y="362" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#78350F">file path</text>
  <text x="500" y="378" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78350F">(access key + secret)</text>

  <rect x="600" y="320" width="150" height="70" rx="6" fill="#E0E7FF" stroke="#4338CA"/>
  <text x="675" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#312E81">3. region_name</text>
  <text x="675" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#312E81">+ cluster_name</text>

  <!-- Token -->
  <rect x="390" y="480" width="220" height="90" rx="8" fill="#E9D5FF" stroke="#7E22CE"/>
  <text x="500" y="512" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#581C87">Token EKS (temporal)</text>
  <text x="500" y="532" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#581C87">generado al conectar</text>
  <text x="500" y="550" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#581C87">desde archivo IAM</text>

  <!-- External column -->
  <rect x="880" y="160" width="160" height="80" rx="8" fill="#BAE6FD" stroke="#0369A1"/>
  <text x="960" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0C4A6E">Bastion SSH</text>
  <text x="960" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0C4A6E">(EC2)</text>

  <rect x="880" y="320" width="160" height="80" rx="8" fill="#BAE6FD" stroke="#0369A1"/>
  <text x="960" y="356" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0C4A6E">EKS API Server</text>
  <text x="960" y="376" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0C4A6E">HTTPS :443</text>

  <rect x="880" y="480" width="160" height="80" rx="8" fill="#BBF7D0" stroke="#15803D"/>
  <text x="960" y="516" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532D">Pods / Deployments</text>
  <text x="960" y="536" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#14532D">ConfigMaps (RO)</text>

  <defs>
    <marker id="aDark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0F172A"/></marker>
    <marker id="aAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B45309"/></marker>
    <marker id="aIndigo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4338CA"/></marker>
    <marker id="aPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7E22CE"/></marker>
    <marker id="aBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0369A1"/></marker>
    <marker id="aGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#15803D"/></marker>
  </defs>

  <!-- User ? Faro -->
  <line x1="170" y1="240" x2="390" y2="205" stroke="#0F172A" stroke-width="2" marker-end="url(#aDark)"/>
  <rect x="250" y="208" width="48" height="16" fill="#FFFFFF"/><text x="274" y="220" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F172A">usa UI</text>

  <!-- Faro ? PEM (down-left via y=290) -->
  <polyline points="445,250 445,290 325,290 325,320" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aAmber)"/>
  <rect x="350" y="274" width="36" height="14" fill="#FFFFFF"/><text x="368" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#78350F">ruta</text>

  <!-- Faro ? IAM (straight down) -->
  <line x1="500" y1="250" x2="500" y2="320" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aAmber)"/>
  <rect x="508" y="274" width="36" height="14" fill="#FFFFFF"/><text x="526" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#78350F">ruta</text>

  <!-- Faro ? region (down-right via y=290) -->
  <polyline points="555,250 555,290 675,290 675,320" fill="none" stroke="#4338CA" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aIndigo)"/>
  <rect x="590" y="274" width="28" height="14" fill="#FFFFFF"/><text x="604" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#312E81">ids</text>

  <!-- IAM ? token -->
  <line x1="500" y1="390" x2="500" y2="480" stroke="#7E22CE" stroke-width="2" marker-end="url(#aPurple)"/>
  <rect x="508" y="424" width="48" height="14" fill="#FFFFFF"/><text x="532" y="435" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#581C87">genera</text>

  <!-- region ? token (down then left along y=525) -->
  <polyline points="675,390 675,525 610,525" fill="none" stroke="#4338CA" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aIndigo)"/>
  <rect x="640" y="448" width="28" height="14" fill="#FFFFFF"/><text x="654" y="459" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#312E81">usa</text>

  <!-- Faro ? Bastion -->
  <line x1="610" y1="190" x2="880" y2="200" stroke="#0369A1" stroke-width="2" marker-end="url(#aBlue)"/>
  <rect x="680" y="168" width="100" height="28" fill="#FFFFFF"/><text x="730" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0C4A6E">A. Tunel SSH</text><text x="730" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0C4A6E">(usa PEM)</text>

  <!-- Bastion ? EKS -->
  <line x1="960" y1="240" x2="960" y2="320" stroke="#0369A1" stroke-width="2" marker-end="url(#aBlue)"/>
  <rect x="968" y="268" width="90" height="16" fill="#FFFFFF"/><text x="1013" y="280" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0C4A6E">B. Forward :443</text>

  <!-- Token ? EKS (right rail at x=820) -->
  <polyline points="610,525 820,525 820,380 880,380" fill="none" stroke="#7E22CE" stroke-width="2" marker-end="url(#aPurple)"/>
  <rect x="740" y="500" width="90" height="28" fill="#FFFFFF"/><text x="785" y="512" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#581C87">C. Auth kube</text><text x="785" y="524" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#581C87">(Bearer token)</text>

  <!-- EKS ? workloads -->
  <line x1="960" y1="400" x2="960" y2="480" stroke="#15803D" stroke-width="2" marker-end="url(#aGreen)"/>
  <rect x="968" y="428" width="90" height="16" fill="#FFFFFF"/><text x="1013" y="440" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#14532D">D. get/list/logs</text>

  <rect x="40" y="680" width="1000" height="40" rx="6" fill="#FFFFFF" stroke="#64748B"/>
  <text x="52" y="704" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0F172A">Constitution VI: Faro no persiste PEM ni Access Key/Secret � solo rutas e identificadores (region_name, cluster_name, bastion).</text>
</svg>
